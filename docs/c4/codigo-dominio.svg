<text x="40" y="696" font-size="12.5" font-weight="bold" fill="#0b4f8a">RN02 — Vínculo Docente (Turma)</text>
<text x="40" y="716" font-size="12" fill="#1e293b">Apenas o professor titular da turma pode lançar ou</text>
<text x="40" y="734" font-size="12" fill="#1e293b">alterar notas dos alunos nela matriculados.</text>
<rect x="478" y="674" width="445" height="76" rx="4" ry="4" fill="#f0f6fc" stroke="#438dd5" stroke-width="1.3"/>
<rect x="478" y="674" width="5" height="76" rx="2" fill="#1168bd"/>
<text x="494" y="696" font-size="12.5" font-weight="bold" fill="#0b4f8a">RN03 e RN04 — Matrícula Única e Ativa</text>
<text x="494" y="716" font-size="12" fill="#1e293b">RN03: aluno único por turma e período letivo.</text>
<text x="494" y="734" font-size="12" fill="#1e293b">RN04: lançamento de nota exige matrícula ativa.</text>
<rect x="942" y="674" width="445" height="76" rx="4" ry="4" fill="#f0f6fc" stroke="#438dd5" stroke-width="1.3"/>
<rect x="942" y="674" width="5" height="76" rx="2" fill="#1168bd"/>
<text x="958" y="696" font-size="12.5" font-weight="bold" fill="#0b4f8a">RN01 — Intervalo Válido de Notas (Nota)</text>
<text x="958" y="716" font-size="12" fill="#1e293b">Toda nota deve estar entre 0.0 e 10.0;</text>
<text x="958" y="734" font-size="12" fill="#1e293b">valores fora do intervalo lançam erro de domínio.</text>
<rect x="1406" y="674" width="450" height="76" rx="4" ry="4" fill="#f0f6fc" stroke="#438dd5" stroke-width="1.3"/>
<rect x="1406" y="674" width="5" height="76" rx="2" fill="#1168bd"/>
<text x="1422" y="696" font-size="12.5" font-weight="bold" fill="#0b4f8a">RN05 — Cálculo de Situação (Boletim)</text>
<text x="1422" y="716" font-size="12" fill="#1e293b">Média &gt;= 7.0: Aprovado · Média &lt; 7.0: Reprovado ·</text>
<text x="1422" y="734" font-size="12" fill="#1e293b">Sem notas lançadas: Em andamento.</text>
