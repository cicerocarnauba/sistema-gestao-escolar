<text x="726" y="94" font-size="12" fill="#1e293b">1. Busca a Turma e confere se o professor autenticado é o titular (RN02)   ·   2. Busca a Matricula ativa do aluno na turma (RN04)</text>
<text x="726" y="112" font-size="12" fill="#1e293b">3. Cria ou altera a Nota validando o intervalo de 0.0 a 10.0 (RN01)         ·   4. Persiste a Nota através do contrato NotaRepoPort</text>
